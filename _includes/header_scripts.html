<script type="text/javascript">
  const getPreferredTheme = () => {
    if (
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches
    ) {
      return "dark";
    } else {
      return "light";
    }
  };

  const toggleTheme = () => {
    const currentTheme = document.body.classList.contains("theme--dark")
      ? "dark"
      : "light";
    const newTheme = currentTheme === "dark" ? "light" : "dark";

    document.body.classList.remove(`theme--${currentTheme}`);
    document.body.classList.add(`theme--${newTheme}`);
    localStorage.setItem("theme", newTheme);
  };

  const applyTheme = () => {
    const storedTheme = localStorage.getItem("theme");
    const preferredTheme = getPreferredTheme();

    const themeToApply = storedTheme || preferredTheme;
    document.body.classList.add(`theme--${themeToApply}`);
  };

  applyTheme();

  // Opened from the Google Play build of the app: hide donation links and keep
  // the flag on every link to this site, so they stay hidden while browsing.
  if (new URLSearchParams(location.search).has("gplay")) {
    document.documentElement.classList.add("gplay");
    document.addEventListener("DOMContentLoaded", () => {
      for (const a of document.querySelectorAll("a[href]")) {
        if (a.getAttribute("href").startsWith("#")) continue;
        const url = new URL(a.href, location.href);
        if (url.origin !== location.origin) continue;
        url.searchParams.set("gplay", "1");
        a.href = url.href;
      }
    });
  }
</script>
